[package]
name = "h3-peer"
version = "0.1.0"
edition = "2021"
publish = false

# An HTTP/3 server and client on the reference implementation itself, h3 0.0.8 + h3-quinn 0.0.9 (quinn 0.11, rustls
# 0.23 with ring, TLS 1.3, ALPN "h3"), with the same routes and scenarios as the neton peer (../src, `h3interop`), for
# the scenarios h3's examples do not cover (POST, bodies both ways, trailers, GOAWAY). The h3 source tree is expected
# next to this directory as ../h3-0.0.8 (run-interop.sh sets that up on the test host).

[dependencies]
h3 = { path = "../h3-0.0.8/h3" }
h3-quinn = { path = "../h3-0.0.8/h3-quinn" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["full"] }
bytes = "1"
http = "1"
futures = "0.3"
anyhow = "1"
