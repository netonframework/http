[package]
name = "probe"
version = "0.0.0"
edition = "2021"
publish = false

# The reference (hyper 1.11.1, which neton.http's HTTP/1 replicates) as an HTTP/1 parse probe for differential.py.
[dependencies]
hyper = { version = "=1.11.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http-body-util = "=0.1.3"
tokio = { version = "1", features = ["rt", "net", "macros"] }
