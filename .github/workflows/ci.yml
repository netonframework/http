name: CI

# The whole suite on every platform GitHub hosts: macOS (kqueue), Linux x64 (epoll, io_uring), Windows (IOCP,
# WSAPoll), each over in-memory stream pairs and, on Linux epoll, over loopback TCP as well
# (NETON_HTTP_TEST_TRANSPORT=tcp, SPEC §6); every target compiled. Any branch, PRs, or by hand.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS kqueue, os: macos-14, task: macosArm64Test, driver: "", transport: "" }
          - { name: Linux epoll, os: ubuntu-latest, task: linuxX64Test, driver: epoll, transport: "" }
          - { name: Linux epoll TCP, os: ubuntu-latest, task: linuxX64Test, driver: epoll, transport: tcp }
          - { name: Linux io_uring, os: ubuntu-latest, task: linuxX64Test, driver: iouring, transport: "" }
          - { name: Windows IOCP, os: windows-latest, task: mingwX64Test, driver: "", transport: "" }
          - { name: Windows WSAPoll, os: windows-latest, task: mingwX64Test, driver: wsapoll, transport: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      NETON_IO_DRIVER: ${{ matrix.driver }}
      NETON_HTTP_TEST_TRANSPORT: ${{ matrix.transport }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
      - name: Test
        shell: bash
        run: ./gradlew :http:${{ matrix.task }} --no-daemon --stacktrace --continue
      - name: Summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, re
          tests = fails = skipped = 0; failed = []
          for f in glob.glob('http/build/test-results/**/*.xml', recursive=True):
              s = open(f, encoding='utf-8', errors='replace').read()
              m = re.search(r'tests="(\d+)" skipped="(\d+)"', s)
              if m: tests += int(m.group(1)); skipped += int(m.group(2))
              for c in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure message="([^"]*)"', s):
                  fails += 1; failed.append(f"- {c.group(2)}.{c.group(1)}: {c.group(3)[:300]}")
          print(f"### ${{ matrix.name }}: {tests} tests ({skipped} skipped), {fails} failures")
          print("\n".join(failed))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: |
            http/build/test-results/**
            http/build/reports/tests/**
          if-no-files-found: ignore

  build-all-targets:
    name: compile (all targets)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile every target, and the shared source sets as publishing does
        run: >
          ./gradlew --no-daemon --stacktrace
          :http:compileKotlinLinuxX64 :http:compileKotlinLinuxArm64 :http:compileKotlinMacosArm64 :http:compileKotlinMacosX64
          :http:compileKotlinMingwX64 :http:compileKotlinIosArm64 :http:compileKotlinIosSimulatorArm64 :http:compileKotlinIosX64
          :http:compileKotlinAndroidNativeArm64 :http:compileKotlinAndroidNativeArm32 :http:compileKotlinAndroidNativeX64
          :http:compileKotlinAndroidNativeX86 :http:compileNativeMainKotlinMetadata
